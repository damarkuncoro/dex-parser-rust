[package]
name = "dex-parser-rust"
version = "1.1.0"
edition = "2021"
authors = ["Damar Kuncoro <damarkuncoro@gmail.com>"]
description = "A high-performance, modular, and parallel Android DEX/APK parsing engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/damarkuncoro/dex-parser-rust"
readme = "README.md"
keywords = ["android", "dex", "parser", "reverse-engineering", "parallel"]
categories = ["parser-implementations", "development-tools"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
scroll = { version = "0.11.0", features = ["derive"] }
thiserror = "1.0"
hex = "0.4"
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
sha1 = "0.10"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
once_cell = "1.18"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }
